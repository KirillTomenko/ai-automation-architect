# Демо-деплой на один VPS. Переменные окружения — из .env рядом с этим файлом,
# в compose-файле не хардкодятся. Docker Compose подхватывает .env автоматически
# и для интерполяции ${APP_PORT}, и как env_file для контейнера.
services:
  app:
    build: .
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000" # порт хоста — APP_PORT из .env (по умолчанию 8000); внутри контейнера всегда 8000
    restart: unless-stopped